name: quranak_app
description: تطبيق قرآنك الإسلامي - تصميم عربي مطابق للموقع، يعمل أوفلاين، أذان تلقائي كالمنبه، لوحة تحكم وإشعارات
publish_to: 'none'
version: 8.0.0+8

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  video_player: ^2.9.2
  flutter_local_notifications: ^17.2.3
  android_alarm_manager_plus: ^4.0.4
  timezone: ^0.9.4
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  dio: ^5.7.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
